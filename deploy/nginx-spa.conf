# Staging / production edge: static SPA (dist/) + API proxy + SPA fallback.
# Deep links like /wholesale/c/phones and /account must not 404.

upstream equarios_api {
  server api:8787 max_fails=3 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep directory redirects relative so staging on :8088 does not drop the port
  absolute_redirect off;

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://equarios_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /ws {
    proxy_pass http://equarios_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /uploads/ {
    proxy_pass http://equarios_api;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1h;
  }

  # Prerendered SEO shells live as real files under dist/; SPA routes fall through.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
