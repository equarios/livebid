upstream equarios_api {
  least_conn;
  server api1:8787 max_fails=3 fail_timeout=10s;
  server api2:8787 max_fails=3 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://equarios_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /ws {
    proxy_pass http://equarios_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /uploads/ {
    proxy_pass http://equarios_api;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1h;
  }

  location /api/health {
    proxy_pass http://equarios_api;
    proxy_set_header Host $host;
  }

  location / {
    default_type text/plain;
    return 200 'equarios edge — API at /api health at /api/health ws at /ws\n';
  }
}
