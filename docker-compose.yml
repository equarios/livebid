# Optional scale stack (local demo still uses SQLite + local disk + memory cache).
#
#   docker compose up -d
#
# Postgres: set schema provider to postgresql + DATABASE_URL below
# Redis:    REDIS_URL=redis://localhost:6379
# MinIO:    S3_* vars below (S3-compatible CDN origin)
#
# Note: upstream minio/minio and quay.io/minio/* no longer allow anonymous pulls.
# Silo is a MinIO-compatible fork that preserves the S3 API and MINIO_* env vars.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: equarios
      POSTGRES_PASSWORD: equarios
      POSTGRES_DB: equarios
    volumes:
      - equarios_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U equarios -d equarios']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: equarios
      MINIO_ROOT_PASSWORD: equariossecret
    volumes:
      - equarios_minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # One-shot bucket create (aws-cli — upstream minio/mc is no longer anonymously pullable)
  minio-init:
    image: amazon/aws-cli:2.27.25
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: equarios
      AWS_SECRET_ACCESS_KEY: equariossecret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      aws --endpoint-url http://minio:9000 s3 mb s3://equarios || true;
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::equarios/*\"]}]}' > /tmp/equarios-public.json;
      aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket equarios --policy file:///tmp/equarios-public.json || true;
      exit 0;
      "

volumes:
  equarios_pg:
  equarios_minio:
